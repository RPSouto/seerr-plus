name: Upstream Sync Check

on:
  schedule:
    # Run every Sunday at 04:00 UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-upstream:
    name: Check seerr-team/seerr releases
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest upstream release
        id: upstream
        run: |
          LOCAL_VERSION=$(jq -r .version package.json)
          UPSTREAM_TAG=$(curl -s https://api.github.com/repos/seerr-team/seerr/releases/latest | jq -r .tag_name)
          UPSTREAM_VERSION=${UPSTREAM_TAG#v}

          echo "local_version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"

          if [ "$LOCAL_VERSION" != "$UPSTREAM_VERSION" ] && [ -n "$UPSTREAM_VERSION" ] && [ "$UPSTREAM_VERSION" != "null" ]; then
            echo "new_release_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Notification Issue
        if: steps.upstream.outputs.new_release_available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const upstreamVer = '${{ steps.upstream.outputs.upstream_version }}';
            const localVer = '${{ steps.upstream.outputs.local_version }}';
            const upstreamTag = '${{ steps.upstream.outputs.upstream_tag }}';
            
            const title = `🚨 Nova versão a montante disponível: Seerr ${upstreamTag}`;
            const body = `Foi detetada uma nova versão oficial da equipa Seerr:\n\n- **Versão Upstream:** ${upstreamTag}\n- **Versão Atual do Fork:** v${localVer}\n\nPara atualizar o fork:\n\`\`\`bash\ngit fetch upstream\ngit merge ${upstreamTag}\n\`\`\`\n\nRelease oficial: https://github.com/seerr-team/seerr/releases/tag/${upstreamTag}`;
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['upstream-sync']
            });
            
            const existing = issues.data.find(i => i.title === title);
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['upstream-sync', 'maintenance']
              });
              console.log('Created issue for new release: ' + upstreamTag);
            } else {
              console.log('Issue already exists for release: ' + upstreamTag);
            }
