name: Build & Publish Docker Image (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - 'seerr-plus-v*'
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'charts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Versions
        id: versions
        run: |
          PKG_VER=$(jq -r .version package.json)
          PLUS_VER=$(tr -d '[:space:]' < SEERR_PLUS_VERSION 2>/dev/null || echo "1.8.455")
          PLUS_VER_CLEAN=${PLUS_VER#seerr-plus-v}
          PLUS_VER_CLEAN=${PLUS_VER_CLEAN#v}
          echo "pkg_version=${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "plus_version=${PLUS_VER_CLEAN}" >> "$GITHUB_OUTPUT"
          echo "commit_tag=seerr-plus-v${PLUS_VER_CLEAN}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAGS="${REPO_LOWER}:latest"
          TAGS="${TAGS},${REPO_LOWER}:${{ steps.versions.outputs.pkg_version }}"
          TAGS="${TAGS},${REPO_LOWER}:${{ steps.versions.outputs.plus_version }}"
          TAGS="${TAGS},${REPO_LOWER}:${{ steps.versions.outputs.commit_tag }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT_TAG=${{ steps.versions.outputs.commit_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
